apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami-ingressroute
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`whoami.k8s.localhost`)
      kind: Rule
      services:
        - name: whoami
          port: 80
  tls:
    certResolver: stepacme # Dispara inmediatamente la petición a Step-CA