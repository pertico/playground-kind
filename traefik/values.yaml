deployment:
  hostAliases:
    - ip: "172.21.0.1"
      hostnames:
        - "step-ca"
env:
  - name: LEGO_CA_CERTIFICATES
    value: "/etc/step-ca/root_ca.crt"    

volumes:
  - name: step-ca-root
    type: configMap
    mountPath: "/etc/step-ca"

additionalArguments:
  - "--certificatesresolvers.stepacme.acme.caserver=https://step-ca:9000/acme/acme/directory"
  - "--certificatesresolvers.stepacme.acme.email=admin@k8s.localhost"
  - "--certificatesresolvers.stepacme.acme.storage=/data/acme.json"
  - "--certificatesresolvers.stepacme.acme.tlschallenge=true" # <-- Flag exacto CLI
  
# Configure Network Ports and EntryPoints
# EntryPoints are the network listeners for incoming traffic.
ports:
  # Defines the HTTP entry point named 'web'
  web:
    port: 9080
    nodePort: 30080
    # Instructs this entry point to redirect all traffic to the 'websecure' entry point
#    http:
#      redirections:
#        entryPoint:
#          to: websecure
#          scheme: https
#          permanent: true

  # Defines the HTTPS entry point named 'websecure'
  websecure:
    port: 9443
    nodePort: 30443

# Enables the dashboard in Secure Mode
api:
  dashboard: true
  insecure: true

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.k8s.localhost`)
    entryPoints:
      - websecure

# Creates a BasicAuth Middleware and Secret for the Dashboard Security
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: TLSStore
    metadata:
      name: default
      namespace: traefik
    spec:
      defaultCertificate:
        secretName: traefik-k8s-localhost-tls

# We will route with Gateway API instead.
ingressClass:
  enabled: true

# Enable Gateway API Provider & Disables the KubernetesIngress provider
# Providers tell Traefik where to find routing configuration.
providers:
  kubernetesIngress:
    enabled: true
  kubernetesGateway:
    enabled: false

# Enable Observability
log:
  level: INFO
# This enables access logs, outputting them to Traefik's standard output by default. The [Access Logs Documentation](https://doc.traefik.io/traefik/observability/access-logs/) covers formatting, filtering, and output options.
accessLog:
  enabled: true

# Enables Prometheus for Metrics
metrics:
  prometheus:
    enabled: true